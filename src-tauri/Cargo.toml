[package]
name = "kemet-download"
version = "0.1.0"
description = "Kemet Download"
authors = ["Kemet"]
edition = "2021"

[lib]
name = "kemet_download_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
