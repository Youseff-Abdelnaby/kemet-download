name: Build Kemet Download

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/icons/icon.ico)) {
            npx --yes @tauri-apps/cli@2 icon app-icon.png
          }

      - name: Build Windows installer (NSIS)
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: kemet-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build universal APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk KemetDownload-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kemet-android-apk
          path: KemetDownload-universal.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.apk
